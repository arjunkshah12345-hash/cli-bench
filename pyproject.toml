[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-bench"
version = "0.9.0"
description = "An apples-to-apples benchmark for agent harnesses: one model, many CLIs, same tasks, same verifier, same budget."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CLI-Bench contributors" }]
keywords = ["benchmark", "agents", "cli", "harness", "llm", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
docker = []  # reserved: docker backend extra deps

[project.scripts]
cbench = "cli_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cli_bench"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
