name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Types (mypy)
        run: mypy cli_bench
      - name: Verifier self-checks (never-starts-green)
        run: pytest tests/test_tasks.py -q
      - name: Tests
        run: pytest -q
      - name: Mock end-to-end
        run: |
          CBENCH_MOCK_FAST=1 cbench run --harness mock-a --model mock/gpt-5.3 --seeds 1 --runs /tmp/cbench-ci
          RD=$(ls -td /tmp/cbench-ci/* | head -1)
          cbench score "$RD"
